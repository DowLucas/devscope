services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: devscope
    volumes:
      - gc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devscope"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    environment:
      PORT: "6767"
      NODE_ENV: production
      DATABASE_URL: postgres://devscope:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devscope
      STALE_SESSION_TIMEOUT_MINUTES: "${STALE_SESSION_TIMEOUT_MINUTES:-5}"
      GC_CORS_ORIGIN: ${GC_CORS_ORIGIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://backend:6767}
      DEVSCOPE_ADMIN_EMAIL: ${DEVSCOPE_ADMIN_EMAIL:-admin@devscope.local}
      DEVSCOPE_ADMIN_PASSWORD: ${DEVSCOPE_ADMIN_PASSWORD:?DEVSCOPE_ADMIN_PASSWORD must be set}
      DEVSCOPE_ADMIN_NAME: ${DEVSCOPE_ADMIN_NAME:-Admin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-1000000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  egress-proxy:
    build:
      context: ./docker/egress-proxy
    image: devscope/egress-proxy:local
    networks:
      - devscope-egress-allowlist
      - default
    restart: unless-stopped

  # Suggestion worker (Task 5.1 scaffold). Always running, but gated by
  # SUGGESTION_WORKER_ENABLED — defaults to `false`, so the loop sleeps and
  # never claims a candidate until the flag is flipped. Crash recovery is via
  # the 10-minute `claim_expires_at` lease set by claimNextCandidate.
  suggestion-worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://devscope:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/devscope
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUGGESTION_WORKER_ENABLED: ${SUGGESTION_WORKER_ENABLED:-false}
      DEVSCOPE_TOKEN_ENCRYPTION_KEY: ${DEVSCOPE_TOKEN_ENCRYPTION_KEY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-devscope/worker-sandbox:local}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-devscope-cloud_devscope-egress-allowlist}
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://egress-proxy:8888}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Worker spawns sandbox containers via the host Docker daemon (Task 5.2).
      - /var/run/docker.sock:/var/run/docker.sock:rw
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
      target: production
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Locked-down network for sandbox containers (Task 3.2). `internal: true`
  # means no host or external connectivity by default. The `egress-proxy`
  # service is the only other member and bridges to `default` for upstream
  # HTTPS to the allowlisted hosts (api.anthropic.com, api.github.com,
  # *.githubusercontent.com).
  devscope-egress-allowlist:
    internal: true

volumes:
  gc-pgdata:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
