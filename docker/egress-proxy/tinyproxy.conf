# DevScope egress proxy — tinyproxy config
#
# Exposes an HTTP/HTTPS-CONNECT forward proxy on :8888 to clients on the
# internal docker network `devscope-egress-allowlist`. Destinations are
# restricted to the hostname patterns listed in /etc/tinyproxy/filter
# (default-deny). Logs only connection-level info (host:port + status).
# Never URL paths, query strings, or headers — sandbox traffic may include
# tokens/PII we do not want bleeding into operator logs.

# Run as root inside the container so tinyproxy can write logs to
# /dev/stdout (owned by root). The container itself has no other
# processes and is reachable only from the internal docker network,
# so dropping to an in-container unprivileged user adds little.
# (Equivalent to most single-process Alpine service containers.)

Port 8888
Listen 0.0.0.0
Timeout 600

# Inbound ACL — allow any client on the docker network. The network itself
# is `internal: true` so only the sandbox + proxy can reach this port.
Allow 0.0.0.0/0

# Filter destinations by hostname (not URL path). Default-deny: anything
# not matching a regex in the filter file is rejected with 403.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterCaseSensitive No
FilterURLs No
# FilterExtended enables POSIX extended regex syntax (the only mode the
# 1.11.2 build supports). Newer tinyproxy uses `FilterType host` instead;
# we'll switch when we upgrade the base image.
FilterExtended Yes

# Tunnel HTTPS via CONNECT — restrict to standard TLS ports only so the
# sandbox cannot CONNECT to arbitrary services.
ConnectPort 443
ConnectPort 563

# Logging — connection-level only. INFO logs the destination host:port and
# the HTTP status, but tinyproxy does not log full request URLs at this
# level (those require LogLevel Connect/Info with FilterURLs Yes, which
# we explicitly disable). Keep on stdout for `docker logs`.
LogLevel Notice
# Tinyproxy refuses to open /dev/stdout (the symlink target changes
# between fork and open, which it treats as a TOCTOU risk). Log to a
# fixed file; the Dockerfile CMD runs `tail -F` of this file in the
# background so logs appear in `docker logs`.
LogFile "/var/log/tinyproxy/tinyproxy.log"

# Strip identifying / forwarding headers so upstream services cannot see
# the internal docker hostnames.
DisableViaHeader Yes
XTinyproxy No

# No upstream auth — the proxy is reachable only on the internal docker
# network; auth would add complexity without security benefit.
MaxClients 50
