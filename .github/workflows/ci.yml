name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run backend tests
        run: |
          cd packages/backend
          # Run each test file in its own process to avoid Bun mock.module()
          # leaking between files (known Bun limitation with module mocking)
          for f in $(find src -name '*.test.ts' | sort); do
            echo "--- $f ---"
            bun test "$f" || exit 1
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cd packages/dashboard && bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cd packages/dashboard && bunx tsc --noEmit

  deploy:
    name: Build & Push Image
    needs: [test, lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/dowlucas/devscope-backend:latest
            ghcr.io/dowlucas/devscope-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-staging:
    name: Verify staging & promote to :stable
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: Force staging Watchtower update (best-effort)
        env:
          STAGING_WATCHTOWER_URL: ${{ secrets.STAGING_WATCHTOWER_URL }}
          STAGING_WATCHTOWER_TOKEN: ${{ secrets.STAGING_WATCHTOWER_TOKEN }}
        continue-on-error: true
        run: |
          if [ -z "$STAGING_WATCHTOWER_URL" ]; then
            echo "STAGING_WATCHTOWER_URL not set — falling back to Watchtower's poll interval."
            exit 0
          fi
          echo "Triggering staging Watchtower at $STAGING_WATCHTOWER_URL"
          curl -sS -X POST \
            -H "Authorization: Bearer $STAGING_WATCHTOWER_TOKEN" \
            --max-time 30 \
            "$STAGING_WATCHTOWER_URL" || true

      - name: Wait for staging to report new commit
        env:
          STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$STAGING_HEALTH_URL" ]; then
            echo "::error::STAGING_HEALTH_URL secret not set — staging gate not configured."
            exit 1
          fi
          deadline=$(( $(date +%s) + 600 ))  # 10 min
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -sS --max-time 10 "$STAGING_HEALTH_URL" || true)"
            commit="$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "staging /api/health → commit=${commit:-<none>} (want ${EXPECTED_SHA})"
            if [ "$commit" = "$EXPECTED_SHA" ]; then
              echo "Staging is on the new commit."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging did not report commit=$EXPECTED_SHA within 10 min."
          echo "Last health response: $body"
          exit 1

      - name: Smoke staging
        env:
          STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          set -e
          body="$(curl -fsS --max-time 10 "$STAGING_HEALTH_URL")"
          echo "$body"
          status="$(echo "$body" | jq -r '.status')"
          clients="$(echo "$body" | jq -r '.clients')"
          if [ "$status" != "ok" ]; then
            echo "::error::status was '$status', expected 'ok'"
            exit 1
          fi
          if ! [[ "$clients" =~ ^[0-9]+$ ]]; then
            echo "::error::clients was '$clients', expected non-negative integer"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote :${{ github.sha }} → :stable
        run: |
          set -e
          IMG=ghcr.io/dowlucas/devscope-backend
          docker pull "$IMG:${{ github.sha }}"
          docker tag  "$IMG:${{ github.sha }}" "$IMG:stable"
          docker push "$IMG:stable"
          echo "Promoted $IMG:${{ github.sha }} to :stable."
