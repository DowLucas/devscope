name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run backend tests
        run: |
          cd packages/backend
          # Run each test file in its own process to avoid Bun mock.module()
          # leaking between files (known Bun limitation with module mocking)
          for f in $(find src -name '*.test.ts' | sort); do
            echo "--- $f ---"
            bun test "$f" || exit 1
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cd packages/dashboard && bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cd packages/dashboard && bunx tsc --noEmit

  deploy:
    name: Build & Push Image
    needs: [test, lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/railway.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dowlucas/devscope-backend:latest
            ghcr.io/dowlucas/devscope-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
