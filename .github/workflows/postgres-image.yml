name: Postgres image

# Builds docker/postgres.Dockerfile (postgres:17.9-alpine + pgvector).
# Postgres is NOT managed by Watchtower: this only publishes the image. Rolling
# it out is a manual, snapshot-first step on the host (see CLAUDE.md
# "Semantic retrieval").
on:
  push:
    branches: [main]
    paths:
      - docker/postgres.Dockerfile
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/postgres.Dockerfile
          push: true
          platforms: linux/amd64
          # Immutable, descriptive tag plus the commit sha. No :latest on
          # purpose — the database image only changes when someone pins it.
          tags: |
            ghcr.io/dowlucas/devscope-postgres:17.9-pgvector0.8.6
            ghcr.io/dowlucas/devscope-postgres:${{ github.sha }}
